<style>

.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border-radius:18px;box-shadow:0 8px 30px #073b7818;padding:24px}.login .card{width:min(420px,100%)}

const ADMIN_USER="admin",ADMIN_PASS="admin123";
let data=load(),editIndex=-1;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return structuredCloneCompat(SEED);
    const x=JSON.parse(raw);
    return Array.isArray(x)?x:structuredCloneCompat(SEED);
  }catch(e){
    return structuredCloneCompat(SEED);
  }
}

function structuredCloneCompat(value){
  return typeof structuredClone==="function"
    ? structuredClone(value)
    : JSON.parse(JSON.stringify(value));
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }catch(e){
    alert("Data tidak dapat disimpan di browser. Periksa izin penyimpanan/localStorage.");
    return false;
  }
}

function getSession(){
  try{return sessionStorage.getItem(AUTH)==="1"}catch(e){return false}
}

function setSession(){
  try{sessionStorage.setItem(AUTH,"1");return true}catch(e){return false}
}

function clearSession(){
  try{sessionStorage.removeItem(AUTH)}catch(e){}
}

function normalizeText(value){
  return String(value??"").trim();
}

function login(event){
  if(event) event.preventDefault();

  const u=document.getElementById("user");
  const p=document.getElementById("pass");
  const e=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");

  e.textContent="";

  const username=normalizeText(u.value);
  const password=String(p.value??"");

  if(!username || !password){
    e.textContent="Username dan password wajib diisi.";
    (!username?u:p).focus();
    return false;
  }

  // Keep comparison strict; do not transform the password.
  if(username===ADMIN_USER && password===ADMIN_PASS){
    if(!setSession()){
      e.textContent="Browser tidak mengizinkan penyimpanan sesi. Coba buka file melalui server lokal.";
      return false;
    }
    p.value="";
    show();
    return true;
  }

  e.textContent="Username atau password salah.";
  p.select();
  p.focus();
  return false;
}

function logout(){
  clearSession();
  document.getElementById("pass").value="";
  document.getElementById("login").style.display="grid";
  document.getElementById("app").style.display="none";
  document.getElementById("user").focus();
}

function show(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  render();
}

document.addEventListener("DOMContentLoaded",()=>{
  const form=document.getElementById("loginForm");
  if(form) form.addEventListener("submit",login);
  if(getSession()) show();
});
function render(){const searchEl=document.getElementById("search"),filterEl=document.getElementById("filter"),tbodyEl=document.getElementById("tbody");let q=searchEl.value.toLowerCase(),c=filterEl.value;
let rows=data.map((x,i)=>({...x,i})).filter(x=>(!c||x.category===c)&&(!q||(x.name+" "+x.description+" "+x.price).toLowerCase().includes(q)));
tbodyEl.innerHTML=rows.map(x=>`<tr><td><span class="badge">${label(x.category)}</span></td><td>${esc(x.name)}</td><td>${esc(x.description||"-")}</td><td>${esc(x.price||"-")}</td><td class="actions"><button class="muted" onclick="openForm(${x.i})">Edit</button><button class="danger" onclick="removeItem(${x.i})">Hapus</button></td></tr>`).join("")||'<tr><td colspan="5" style="text-align:center;padding:25px">Tidak ada data.</td></tr>';
document.getElementById("sTotal").textContent=data.length;document.getElementById("sBan").textContent=data.filter(x=>x.category==="ban").length;document.getElementById("sService").textContent=data.filter(x=>x.category==="service").length;document.getElementById("sOther").textContent=data.filter(x=>x.category==="sparepart"||x.category==="oli").length}
function label(c){return{ban:"Ban",service:"Service",sparepart:"Sparepart",oli:"Oli"}[c]||c}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openForm(i=-1){editIndex=i;const modal=document.getElementById("modal"),modalTitle=document.getElementById("modalTitle"),fCat=document.getElementById("fCat"),fName=document.getElementById("fName"),fDesc=document.getElementById("fDesc"),fPrice=document.getElementById("fPrice");modalTitle.textContent=i<0?"Input Data":"Edit Data";let x=i<0?{category:"ban",name:"",description:"",price:""}:data[i];fCat.value=x.category;fName.value=x.name;fDesc.value=x.description||"";fPrice.value=x.price||"";modal.style.display="block";fName.focus()}
function closeForm(){document.getElementById("modal").style.display="none"}
function saveForm(){const fCat=document.getElementById("fCat"),fName=document.getElementById("fName"),fDesc=document.getElementById("fDesc"),fPrice=document.getElementById("fPrice");let x={category:fCat.value,name:fName.value.trim(),description:fDesc.value.trim(),price:fPrice.value.trim()};if(!x.name)return alert("Nama wajib diisi.");if(editIndex<0)data.unshift(x);else data[editIndex]=x;persist();closeForm();render()}
function removeItem(i){if(confirm("Hapus data '"+data[i].name+"'?")){data.splice(i,1);persist();render()}}
</script></body></html>
